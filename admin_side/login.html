<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; PrintX Admin Operations Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #070a12;
            --bg-card: rgba(17, 24, 39, 0.95);
            --bg-input: #131c2e;
            --border-card: rgba(255, 255, 255, 0.08);
            --border-input: #2a374d;
            --border-focus: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --text-sub: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.35);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --success: #10b981;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(37, 99, 235, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 85%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.4);
        }

        .brand-text {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .brand-accent {
            color: #3b82f6;
        }

        .badge-portal {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 3px 10px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .auth-alert {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .auth-alert.error {
            display: block;
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .auth-alert.success {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-sub);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 46px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 14px;
            padding: 0 16px 0 44px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: #172238;
        }

        .form-input::placeholder {
            color: var(--text-sub);
        }

        .btn-toggle-pass {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            border-radius: 6px;
            transition: color 0.15s ease;
        }

        .btn-toggle-pass:hover {
            color: var(--text-main);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px 0 var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(37, 99, 235, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Sub-action bar below login button: right-aligned forgot password */
        .sub-action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .link-forgot {
            font-size: 13px;
            font-weight: 500;
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .link-forgot:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        /* Divider */
        .auth-divider {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 24px 0 20px;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-divider-text {
            position: relative;
            background: var(--bg-card);
            padding: 0 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Register Shop button (Dedicated, styled secondary button) */
        .btn-register-shop {
            width: 100%;
            height: 48px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-register-shop:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-register-shop svg {
            color: #38bdf8;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <main class="auth-card" role="main">
            <!-- Header -->
            <header class="auth-header">
                <a href="login.html" class="brand-logo">
                    <div class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                    </div>
                    <span class="brand-text">Print<span class="brand-accent">X</span></span>
                </a>
                <div>
                    <span class="badge-portal">Admin Operations Portal</span>
                </div>
                <p class="auth-subtitle">Sign in with authorized staff credentials to manage print orders</p>
            </header>

            <!-- Alert Notification -->
            <div id="login-alert" class="auth-alert" role="alert" aria-live="assertive"></div>

            <!-- Login Form (Only Email/Username & Password) -->
            <form id="admin-login-form" novalidate autocomplete="on">
                <!-- Username / Email Field -->
                <div class="form-group">
                    <label for="admin-username" class="form-label">Email or Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            id="admin-username" 
                            name="username" 
                            class="form-input" 
                            required 
                            autocomplete="username" 
                            placeholder="admin or staff@printx.pk"
                            autofocus
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group" style="margin-bottom: 10px;">
                    <label for="admin-password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="admin-password" 
                            name="password" 
                            class="form-input" 
                            required 
                            autocomplete="current-password" 
                            placeholder="••••••••••••"
                        >
                        <button type="button" id="btn-toggle-pass" class="btn-toggle-pass" title="Toggle password visibility" aria-label="Toggle password visibility">
                            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Right-aligned Forgot Password option directly below password input -->
                <div class="sub-action-bar">
                    <a href="forgot-password.html" class="link-forgot">Forgot password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" id="login-submit-btn" class="btn-primary">
                    <span>Sign In to Admin Dashboard</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span class="auth-divider-text">New Print Station Partner?</span>
            </div>

            <!-- Register Shop Button (Prominently Placed at the bottom) -->
            <a href="register-shop.html" id="btn-goto-register" class="btn-register-shop">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Register Shop & Get QR Code</span>
            </a>

            <!-- Footer -->
            <footer class="auth-footer">
                PrintX Multi-Tenant Operations &bull; Secure Same-Origin Session
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('admin-login-form');
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('login-submit-btn');
            const passInput = document.getElementById('admin-password');
            const togglePassBtn = document.getElementById('btn-toggle-pass');
            const eyeIcon = document.getElementById('eye-icon');

            // Password show/hide toggle
            togglePassBtn.addEventListener('click', function () {
                const isPassword = passInput.getAttribute('type') === 'password';
                passInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIcon.innerHTML = isPassword 
                    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
                    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            });

            function showAlert(msg, isError) {
                alertBox.textContent = msg;
                alertBox.className = 'auth-alert ' + (isError ? 'error' : 'success');
            }

            // Check URL parameters for feedback
            const params = new URLSearchParams(window.location.search);
            if (params.get('logged_out')) {
                showAlert('You have been signed out safely.', false);
            } else if (params.get('registered')) {
                showAlert('Shop registered successfully! Sign in with your new credentials.', false);
            }

            // Auto-redirect if already authenticated
            if (window.PrintXAuth) {
                window.PrintXAuth.redirectIfAuthenticated();
            }

            // Handle Sign In submission
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                alertBox.className = 'auth-alert';
                alertBox.textContent = '';

                const username = document.getElementById('admin-username').value.trim();
                const password = passInput.value;

                if (!username || !password) {
                    showAlert('Please enter both username/email and password.', true);
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Verifying credentials...</span>';

                try {
                    const res = await window.PrintXAuth.login(username, password);
                    if (res && res.success) {
                        showAlert('Sign in successful. Loading station dashboard...', false);
                        setTimeout(() => {
                            window.location.href = 'all-order-prints.html';
                        }, 500);
                    } else {
                        showAlert(res.message || 'Invalid username or password.', true);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>Sign In to Admin Dashboard</span>';
                    }
                } catch (err) {
                    showAlert(err.message || 'Login failed. Please check your credentials.', true);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign In to Admin Dashboard</span>';
                }
            });
        });
    </script>
</body>
</html>
