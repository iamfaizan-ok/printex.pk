<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password &bull; PrintX Admin Operations Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #070a12;
            --bg-card: rgba(17, 24, 39, 0.95);
            --bg-input: #131c2e;
            --border-card: rgba(255, 255, 255, 0.08);
            --border-input: #2a374d;
            --border-focus: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --text-sub: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.35);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --success: #10b981;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(37, 99, 235, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.4);
        }

        .brand-text {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-accent {
            color: #3b82f6;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .auth-alert {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .auth-alert.error {
            display: block;
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .auth-alert.success {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-sub);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 46px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 14px;
            padding: 0 16px 0 44px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px 0 var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .auth-switch {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-switch a {
            color: #60a5fa;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <main class="auth-card" role="main">
            <header class="auth-header">
                <a href="login.html" class="brand-logo">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                    </div>
                    <span class="brand-text">Print<span class="brand-accent">X</span></span>
                </a>
                <h1 class="auth-title">Reset Your Password</h1>
                <p class="auth-subtitle">Enter your registered admin email and we'll dispatch a secure recovery link.</p>
            </header>

            <div id="reset-alert" class="auth-alert" role="alert"></div>

            <form id="forgot-form" novalidate>
                <div class="form-group">
                    <label for="reset-email" class="form-label">Admin Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input 
                            type="email" 
                            id="reset-email" 
                            class="form-input" 
                            required 
                            placeholder="admin@printx.pk"
                            autofocus
                        >
                    </div>
                </div>

                <button type="submit" id="reset-submit-btn" class="btn-primary">
                    <span>Send Password Reset Link</span>
                </button>
            </form>

            <div class="auth-switch">
                Remember your credentials? <a href="login.html">Back to Sign In</a>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('forgot-form');
            const alertBox = document.getElementById('reset-alert');
            const submitBtn = document.getElementById('reset-submit-btn');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const email = document.getElementById('reset-email').value.trim();
                if (!email) {
                    alertBox.textContent = 'Please enter your registered email address.';
                    alertBox.className = 'auth-alert error';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Sending reset email...</span>';

                try {
                    const res = await window.PrintXAuth.forgotPassword(email);
                    alertBox.textContent = res.message || 'If an account exists with that email, a password reset link has been dispatched.';
                    alertBox.className = 'auth-alert success';
                } catch (err) {
                    alertBox.textContent = err.message || 'Unable to send reset email.';
                    alertBox.className = 'auth-alert error';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Send Password Reset Link</span>';
                }
            });
        });
    </script>
</body>
</html>
